name: Generate contribution chart

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate contribution grid snake
        uses: Platane/snk@v3
        with:
          github_user_name: riyazrob
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Complete current-week grid with neutral cells
        working-directory: ${{ github.workspace }}/dist
        run: |
          {
            echo "Working directory: $PWD"
            echo "Workspace: $GITHUB_WORKSPACE"
            echo "Generated SVG files:"
            find . -maxdepth 3 -type f -name 'github-contribution-grid-snake*.svg' -print
            node "${{ github.workspace }}/.github/scripts/pad-contribution-grid.mjs" .
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publish contribution chart
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
