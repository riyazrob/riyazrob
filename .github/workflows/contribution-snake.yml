name: Generate contribution chart

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Generate contribution grid snake
        uses: Platane/snk@v3
        with:
          github_user_name: riyazrob
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Complete current-week grid with neutral cells
        working-directory: ${{ github.workspace }}/dist
        run: |
          for file in github-contribution-grid-snake*.svg; do
            for y in 2 18 34 50 66 82 98; do
              if ! grep -q "x=\"834\" y=\"$y\"" "$file"; then
                cell="<rect class=\"c\" x=\"834\" y=\"$y\" rx=\"2\" ry=\"2\"/>"
                sed -i "s#</svg>#$cell</svg>#" "$file"
              fi
            done
          done

      - name: Publish contribution chart
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
